# LeRobot discovers installed distributions whose name starts with
# "lerobot_policy_" and imports them, which registers the "act_enc" policy type
# for lerobot-train / lerobot-eval.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_policy_act_enc"
version = "0.1.0"
description = "ACT with a swappable visual encoder (ResNet18, DINOv2, CLIP, SigLIP), frozen or finetuned"
requires-python = ">=3.12"
dependencies = ["lerobot==0.6.1", "timm>=1.0", "avr"]

[tool.setuptools]
packages = ["lerobot_policy_act_enc"]
